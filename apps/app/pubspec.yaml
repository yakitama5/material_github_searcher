name: material_github_searcher
description: A Material Design GitHub repository search application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: 3.12.2
  flutter: 3.44.8

dependencies:
  application:
    path: ../../packages/application
  cupertino_icons: 1.0.9
  dependency_override:
    path: ../../packages/dependency_override
  designsystem:
    path: ../../packages/designsystem
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  slang: 4.18.0
  slang_flutter: 4.18.0

dev_dependencies:
  build_runner: 2.15.1
  flutter_test:
    sdk: flutter
  patrol: 4.8.0
  slang_build_runner: 4.18.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

patrol:
  app_name: Dev - Material GitHub Searcher
  flavor: dev
  android:
    package_name: com.example.material_github_searcher.dev
  ios:
    bundle_id: com.example.materialGithubSearcher.dev

resolution: workspace
