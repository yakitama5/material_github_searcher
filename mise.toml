[tools]
flutter = "3.44.8"

[tasks."test:e2e"]
description = "接続済み端末でDev FlavorのPatrol E2E Testを実行する"
dir = "apps/app"
usage = 'arg "<device>" help="flutter devicesに表示されるAndroid端末またはiOS SimulatorのID"'
env = { PATROL_FLUTTER_COMMAND = "mise exec -- flutter" }
run = '''
set -eu

device_id="${usage_device?}"
is_booted_ios_simulator=false
if command -v xcrun >/dev/null 2>&1 &&
  xcrun simctl list devices booted 2>/dev/null | grep -Fq "($device_id) (Booted)"; then
  is_booted_ios_simulator=true
fi

if [ "$is_booted_ios_simulator" = false ] && [ -z "${ANDROID_HOME:-}" ]; then
  echo "指定端末が起動中のiOS Simulatorとして検出されませんでした。" >&2
  echo "Android実機で実行する場合はANDROID_HOMEを設定してください。" >&2
  exit 1
fi

if ! command -v patrol >/dev/null 2>&1; then
  echo "Patrol CLIが見つかりません: mise exec -- dart pub global activate patrol_cli 4.6.1" >&2
  exit 1
fi

patrol_version="$(patrol --version 2>&1)"
case "$patrol_version" in
  *"patrol_cli v4.6.1"*) ;;
  *)
    echo "Patrol CLI 4.6.1が必要です: mise exec -- dart pub global activate patrol_cli 4.6.1" >&2
    echo "$patrol_version" >&2
    exit 1
    ;;
esac

patrol test \
  --flavor dev \
  --dart-define-from-file=flavor/dev.json \
  --device "$device_id"
'''
