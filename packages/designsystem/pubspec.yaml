name: designsystem
description: Shared themes and reusable presentation widgets.
publish_to: none
version: 0.1.0

environment:
  sdk: 3.12.2
  flutter: 3.44.8

dependencies:
  # アプリ状態を参照する共通UI（今後追加予定）で application の Provider を
  # 監視するために保持する。現時点では未使用（docs/ARCHITECTURE.md 参照）。
  application:
    path: ../application
  domain:
    path: ../domain
  flutter:
    sdk: flutter

dev_dependencies:
  alchemist: 0.14.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

resolution: workspace
