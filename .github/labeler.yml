# ラベル名は .github/labels.yaml (色・説明の定義) のnameと一致させること。
"documentation":
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

"github_actions":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

"dart":
  - changed-files:
      - any-glob-to-any-file: "**/*.dart"

"layer: domain":
  - changed-files:
      - any-glob-to-any-file: "packages/domain/**"

"layer: application":
  - changed-files:
      - any-glob-to-any-file: "packages/application/**"

"layer: infrastructure":
  - changed-files:
      - any-glob-to-any-file: "packages/infrastructure/**"

"layer: designsystem+app":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/designsystem/**"
          - "apps/app/**"
          # Providerと実装を結線するComposition Rootの一部として扱う。
          - "packages/dependency_override/**"

"area: foundation":
  - changed-files:
      - any-glob-to-any-file: "packages/foundation/**"
